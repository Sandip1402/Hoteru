name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy frontend through AWS SSM
        shell: bash
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0732d72bcae2ccd42" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "sudo -u ec2-user bash -lc '\''cd /home/ec2-user/Hoteru && git pull origin main && cd frontend && npm install && npm run build'\''",
              "sudo rm -rf /var/www/hoteru/*",
              "sudo cp -r /home/ec2-user/Hoteru/frontend/dist/* /var/www/hoteru/"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for deployment to finish..."

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-0732d72bcae2ccd42" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Frontend deployment successful."
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then

              echo "Frontend deployment failed."

              echo "----- STDOUT -----"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-0732d72bcae2ccd42" \
                --query "StandardOutputContent" \
                --output text

              echo "----- STDERR -----"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "i-0732d72bcae2ccd42" \
                --query "StandardErrorContent" \
                --output text

              exit 1
            fi

            sleep 10
          done

          echo "Deployment timed out waiting for SSM."
          exit 1